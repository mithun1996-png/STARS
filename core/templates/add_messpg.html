<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Mess / PG</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            /* This adds a dark overlay so your white text stays perfectly readable over the image */
            background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(76, 161, 175, 0.8)), 
                        url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200') no-repeat center center;
            background-size: cover; /* Forces the image to fit the entire header area nicely */
            color: white;
            padding: 40px 20px; /* Increased padding to give the background image more breathing room */
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
            color: #333;
        }

        /* Premium Form Container Card */
        .form-container {
            width: 100%;
            max-width: 750px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-section {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #f5f6fa;
            padding-bottom: 20px;
        }

        .top-section h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .top-section p {
            color: #7f8c8d;
            font-size: 15px;
        }

        /* Grid Layout for compact field grouping */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* Force specific items to take full width inside the grid */
        .full-width {
            grid-column: span 2;
        }

        .input-group {
            margin-bottom: 5px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 500;
            color: #34495e;
            font-size: 14px;
        }

        label i {
            color: #3498db;
            font-size: 14px;
            width: 16px;
            text-align: center;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #fdfdfd;
            color: #2c3e50;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #3498db;
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.15);
        }

        /* Custom styling for file input field */
        input[type="file"] {
            padding: 8px 12px;
            background: #f8f9fa;
            cursor: pointer;
        }

        textarea {
            resize: none;
            height: 110px;
        }

        /* Action Buttons Wrapper */
        .action-group {
            margin-top: 30px;
            text-align: center;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.35);
        }

        .cancel-link {
            display: inline-block;
            margin-top: 15px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .cancel-link:hover {
            color: #c0392b;
        }

        .note {
            text-align: center;
            margin-top: 20px;
            color: #95a5a6;
            font-size: 12px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .form-container {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr; /* Stack everything vertically on tablets/phones */
                gap: 15px;
            }

            .full-width {
                grid-column: span 1;
            }

            .top-section h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="top-section">
            <h1>Add Your Mess / PG</h1>
            <p>Reach students across Medinipur with your accommodation listing</p>
        </div>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-grid">
                
                <div class="input-group full-width">
                    <label><i class="fa-solid fa-hotel"></i> Mess / PG Name</label>
                    <input type="text" name="name" placeholder="e.g. Sunrise Elite Boys Hostel" required>
                </div>

                <div class="input-group full-width">
                    <label><i class="fa-solid fa-user-tie"></i> Owner Name</label>
                    <input type="text" name="owner_name" placeholder="Enter full name" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-map-location-dot"></i> District</label>
                    <select name="district" required>
                        <option value="">Select District</option>
                        <option>Paschim Medinipur</option>
                        <option>Purba Medinipur</option>
                    </select>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-location-crosshairs"></i> Location / Landmark</label>
                    <input type="text" name="location" placeholder="e.g. Near Vidyasagar University" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-indian-rupee-sign"></i> Monthly Rent (₹)</label>
                    <input type="number" name="rent" placeholder="Monthly rent fee" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-utensils"></i> Food Availability</label>
                    <select name="food_available" required>
                        <option value="">Select Option</option>
                        <option>Available</option>
                        <option>Not Available</option>
                    </select>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-phone"></i> WhatsApp Contact Number</label>
                    <input type="tel" name="phone" placeholder="10-digit mobile number" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-camera"></i> Accommodation Photo</label>
                    <input type="file" name="image" accept="image/*">
                </div>

                <div class="input-group full-width">
                    <label><i class="fa-solid fa-align-left"></i> Description & Facilities</label>
                    <textarea name="description" placeholder="Specify room sharing capacity, Wi-Fi availability, water/power supply configurations, rules, etc."></textarea>
                </div>

            </div>

            <div class="action-group">
                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Publish Property Listing
                </button>
                <br>
                <a href="/messpg/" class="cancel-link">
                    <i class="fa-solid fa-xmark"></i> Cancel and Go Back
                </a>
            </div>

        </form>

        <p class="note">
            * Your submission is immediately cataloged and will appear live under active student searches.
        </p>

    </div>

</body>
</html>
