<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete UPI Payment | QPhysics Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070c1e',
                            navy: '#0f172a',
                            card: '#1e293b',
                            blue: '#2563eb',
                            gold: '#fbbf24',
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-navy text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Custom Manual UPI Verification Card -->
    <div class="bg-brand-card p-6 sm:p-8 rounded-2xl border border-slate-700 text-center max-w-md w-full shadow-2xl">
        
        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[11px] font-bold px-3 py-1 rounded-full uppercase tracking-widest inline-block mb-3">
            Step 2: Subscription Payment
        </span>

        <h3 class="font-outfit text-2xl font-bold text-white mb-1">Direct UPI Payment</h3>
        <p class="text-xs text-slate-400 mb-6">Scan using GPay, PhonePe, Paytm, or BHIM to pay <strong>₹299/mo</strong></p>

        <!-- Dynamic UPI QR Code Generator -->
        <div class="bg-white p-3 rounded-2xl inline-block mb-4 shadow-lg">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=YOUR_UPI_ID%26pn=QPhysics%20Academy%26am=299%26cu=INR" 
                 alt="UPI QR Code" 
                 class="w-48 h-48 mx-auto rounded-lg">
        </div>

        <p class="text-xs font-semibold text-slate-300 mb-6">
            UPI ID: <span class="text-brand-gold select-all font-mono font-bold bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">YOUR_UPI_ID@upi</span>
        </p>

        <!-- Form to submit UTR / Ref Number -->
        <form action="{% url 'submit_upi_utr' %}" method="POST" class="space-y-4 text-left">
            {% csrf_token %}
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Transaction Ref / UTR Number</label>
                <input type="text" name="utr_number" maxlength="12" pattern="\d{12}" placeholder="e.g. 401234567890" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:ring-2 focus:ring-brand-blue focus:outline-none font-mono">
            </div>

            <button type="submit" class="w-full bg-brand-blue hover:bg-blue-600 text-white font-outfit text-xs font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30">
                Submit Payment Details
            </button>
        </form>

        <p class="text-[11px] text-slate-500 mt-4">
            <i class="fa-solid fa-shield-halved text-emerald-400"></i> Account will be verified and activated within 1–2 hours.
        </p>
    </div>

</body>
</html>
