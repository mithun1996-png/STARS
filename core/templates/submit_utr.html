<div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-md mx-auto text-center shadow-2xl">
    <h3 class="text-xl font-bold text-white mb-1">Direct UPI Payment</h3>
    <p class="text-xs text-slate-400 mb-4">Scan QR code using GPay, PhonePe, Paytm, or BHIM</p>

    <!-- Dynamic UPI QR Code -->
    <div class="bg-white p-3 rounded-xl inline-block mb-4 shadow">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=dr.mithunpatra@upi%26pn=QPhysics%20Academy%26am=299%26cu=INR" 
             alt="UPI QR Code" 
             class="w-44 h-44 mx-auto rounded">
    </div>

    <p class="text-xs font-semibold text-slate-300 mb-4">
        UPI ID: <span class="text-amber-400 font-mono font-bold bg-slate-900 px-2.5 py-1 rounded border border-slate-700">dr.mithunpatra@upi</span>
    </p>

    <form action="{% url 'submit_upi_utr' teacher.id %}" method="POST" class="space-y-3 text-left">
        {% csrf_token %}
        <input type="hidden" name="membership_tier" value="pro">

        <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">12-Digit UPI Ref / UTR No.</label>
            <input type="text" 
                   name="utr_number" 
                   maxlength="12" 
                   pattern="\d{12}" 
                   placeholder="e.g. 401234567890" 
                   required 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg shadow-blue-500/20">
            Submit Payment Details
        </button>
    </form>
</div>
