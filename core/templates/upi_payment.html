<!DOCTYPE html>
<html>
<head>
    <title>UPI Payment - QPhysics Academy</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-2xl max-w-md w-full text-center border border-slate-700 shadow-xl">
        <h2 class="text-2xl font-bold mb-2">Upgrade Membership</h2>
        <p class="text-slate-400 text-sm mb-6">Complete your payment using GPay, PhonePe, Paytm, or BHIM UPI.</p>
        
        <button id="rzp-button" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">
            Pay ₹299 via UPI
        </button>
    </div>

    <script>
    var options = {
        "key": "{{ razorpay_key }}",
        "amount": "{{ amount }}",
        "currency": "INR",
        "name": "QPhysics Academy",
        "description": "Teacher Pro Membership",
        "order_id": "{{ order_id }}",
        "handler": function (response){
            // Send payment details to backend for verification
            fetch("{% url 'payment_success' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: new URLSearchParams({
                    "razorpay_payment_id": response.razorpay_payment_id,
                    "razorpay_order_id": response.razorpay_order_id,
                    "razorpay_signature": response.razorpay_signature
                })
            }).then(res => res.json())
              .then(data => {
                  alert("Payment Successful!");
                  window.location.href = "{% url 'teachers' %}";
              });
        },
        "prefill": {
            "name": "{{ user_name }}"
        },
        "config": {
            "display": {
                "blocks": {
                    "banks": {
                        "name": "Pay via UPI",
                        "instruments": [
                            { "method": "upi" }
                        ]
                    }
                },
                "sequence": ["block.banks"]
            }
        },
        "theme": { "color": "#2563eb" }
    };

    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button').onclick = function(e){
        rzp1.open();
        e.preventDefault();
    }
    </script>
</body>
</html>
